<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#122733">
<meta name="description" content="StrideBrain by PrimeStride AI. Explore a source-linked, industry-configurable operations demo for Taiwanese SMEs.">
<title>StrideBrain · SME Operations Workspace Demo</title>
<link rel="stylesheet" href="../stridebrain-interiors/app.css">
<link rel="stylesheet" href="./studio.css">
</head>
<body>
<div class="app-shell" id="app">
  <aside class="sidebar" aria-label="Workspace navigation">
    <div class="brand-lockup">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
      <div><strong>StrideBrain</strong><small>BY PRIMESTRIDE AI</small></div>
    </div>
    <div class="switcher-label">ACTIVE DEMO COMPANY</div>
    <div class="workspace-switcher">
      <span class="workspace-avatar" id="company-avatar">禾</span>
      <span class="workspace-name"><strong id="company-name">Horizon Atelier</strong><small id="company-subtitle">Industry workspace</small></span>
    </div>
    <label class="industry-label" for="industry-switcher">Explore a different industry</label>
    <select class="industry-switcher" id="industry-switcher" aria-label="Change industry template"></select>
    <div class="nav-section-label">WORKSPACE</div>
    <nav class="nav-items" id="nav-main">
      <button type="button" data-action="nav" data-value="overview"><span class="nav-glyph">◫</span>Overview</button>
      <button type="button" data-action="nav" data-value="copilot"><span class="nav-glyph">✦</span>StrideBrain Copilot</button>
      <button type="button" data-action="nav" data-value="projects"><span class="nav-glyph">▤</span><span id="nav-entities">Projects</span></button>
      <button type="button" data-action="nav" data-value="knowledge"><span class="nav-glyph">▧</span>Knowledge hub</button>
      <button type="button" data-action="nav" data-value="service"><span class="nav-glyph">✉</span>Customer service</button>
      <button type="button" data-action="nav" data-value="quotes"><span class="nav-glyph">⌗</span><span id="nav-quotations">Quotations</span></button>
      <button type="button" data-action="nav" data-value="history"><span class="nav-glyph">◈</span>Estimate from history <span class="nav-new">NEW</span></button>
      <button type="button" data-action="nav" data-value="work"><span class="nav-glyph">☷</span><span id="nav-work">Work orders</span></button>
      <button type="button" data-action="nav" data-value="suppliers"><span class="nav-glyph">▥</span><span id="nav-materials">Suppliers</span></button>
      <button type="button" data-action="nav" data-value="approvals"><span class="nav-glyph">◇</span>Approvals</button>
      <button type="button" data-action="nav" data-value="analytics"><span class="nav-glyph">▥</span>Analytics</button>
    </nav>
    <div class="nav-section-label">INTELLIGENCE</div>
    <nav class="nav-items" id="nav-intel">
      <button type="button" data-action="nav" data-value="readiness"><span class="nav-glyph">◉</span>Operational checks <span class="nav-new">INTERACTIVE</span></button>
      <button type="button" data-action="nav" data-value="intake"><span class="nav-glyph">⇧</span>Document intelligence <span class="nav-new">NEW</span></button>
      <button type="button" data-action="nav" data-value="playbook"><span class="nav-glyph">▤</span>Industry playbook <span class="nav-new">RESEARCH</span></button>
      <button type="button" data-action="nav" data-value="learning"><span class="nav-glyph">↗</span>Learning & feedback <span class="nav-new">NEW</span></button>
    </nav>
    <div class="sidebar-bottom">
      <div class="demo-status"><span class="pulse-dot"></span><strong>DEMO WORKSPACE</strong><small>Demo data · No company setup required</small></div>
      <button type="button" class="reset-btn" data-action="reset">↺ Reset industry demo</button>
      <div class="sidebar-profile"><span class="profile-icon" id="owner-initials">ML</span><span><strong id="owner-name">Mei Lin</strong><small>Demo workspace owner</small></span></div>
    </div>
  </aside>
  <div class="work-column">
    <header class="topbar">
      <div class="breadcrumb"><span id="top-company">Horizon Atelier</span><span class="crumb-divider">/</span><strong id="page-name">Overview</strong></div>
      <div class="top-actions"><div class="sb-lang-switch" aria-label="語言 / Language"><button type="button" data-action="language" data-value="zh-TW" aria-pressed="true">繁中</button><button type="button" data-action="language" data-value="en" aria-pressed="false">EN</button></div>
        <span class="syn-label"><i></i> SAMPLE DATA</span>
        <button type="button" class="top-menu" data-action="nav" data-value="knowledge">Explore knowledge ↗</button>
      </div>
    </header>
    <main class="main" id="main" tabindex="-1">
      <div class="loading-screen"><div class="loader-ring"></div><h2>Opening your workspace</h2><p>Loading source-linked demonstration records…</p></div>
    </main>
  </div>
  <aside class="inspector" aria-label="Context and source evidence" id="inspector"></aside>
</div>
<div class="evidence-overlay" id="evidence-overlay" role="dialog" aria-modal="true" aria-label="Document source evidence"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module">
const loading=document.querySelector("#main .loading-screen");
let completed=false;
const timeout=setTimeout(()=>showFailure("Workspace startup timed out."),12000);
function showFailure(message){
 if(completed)return; completed=true;clearTimeout(timeout);
 const main=document.getElementById("main");
 if(!main||!main.querySelector(".loading-screen"))return;
 const panel=document.createElement("div");panel.className="panel sb-boot-recovery";
 const title=document.createElement("h2");title.textContent="無法開啟工作區 · Workspace couldn't start";
 const detail=document.createElement("p");detail.textContent="示範程式載入失敗。請重新載入頁面；若問題持續，請將此畫面告知管理員。 / The demo could not initialize. Please retry.";
 const diagnostic=document.createElement("code");diagnostic.textContent=String(message).slice(0,160);
 const retry=document.createElement("button");retry.className="button-primary";retry.textContent="重新載入 · Retry";retry.onclick=()=>location.reload();
 panel.append(title,detail,diagnostic,retry);main.replaceChildren(panel);
}
try{
 await import("./app.js");
 completed=true;clearTimeout(timeout);
}catch(error){showFailure(error?.message||"Module import failed");}
</script>
</body>
</html>
