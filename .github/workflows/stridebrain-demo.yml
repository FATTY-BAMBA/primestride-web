name: StrideBrain Demo Quality Gate
on:
  pull_request:
    paths:
      - 'public/stridebrain-demo/**'
      - 'src/lib/stridebrain-demo/**'
      - 'src/app/api/stridebrain-demo/**'
      - 'tests/stridebrain-*'
      - 'tests/helpers/**'
      - '.github/workflows/stridebrain-demo.yml'
  push:
    branches:
      - feature/stridebrain-interiors-flagship-demo
permissions:
  contents: read
jobs:
  static-and-unit-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser module syntax
        run: |
          for file in public/stridebrain-demo/*.js; do node --check "$file"; done
      - name: Run StrideBrain regression tests
        run: node --test tests/stridebrain-*.test.mjs
  browser-session-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/sb-browser" --no-audit --no-fund playwright@1.51.1
          "$RUNNER_TEMP/sb-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify invitation, cookies, session failures, and AI request handoff
        run: |
          STRIDEBRAIN_PLAYWRIGHT_MODULE="$RUNNER_TEMP/sb-browser/node_modules/playwright/index.mjs" node tests/stridebrain-session.browser.mjs
